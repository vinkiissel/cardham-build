# Self-hosted backend for a small, private instance.
# Runs Postgres, the API, the background worker and Caddy (HTTPS) on a single server.
# See docs/self-hosting.md for setup instructions.
name: arkham-build-selfhost

x-app: &app
  build:
    context: ../..
    dockerfile: backend/Dockerfile
  image: arkham-build-api:local
  env_file: .env
  environment:
    POSTGRES_HOST: db
    DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable
    DBMATE_MIGRATIONS_DIR: /app/backend/src/db/migrations
    DBMATE_SCHEMA_FILE: /app/backend/src/db/schema.sql
    NODE_ENV: production
    PORT: 3000
  depends_on:
    db:
      condition: service_healthy
  restart: unless-stopped

services:
  db:
    image: postgres:18-alpine
    env_file: .env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql

  api:
    <<: *app

  worker:
    <<: *app
    command: ["node", "--experimental-strip-types", "src/worker.ts"]

  caddy:
    image: caddy:2-alpine
    env_file: .env
    ports:
      - "80:80"
      - "443:443"
    restart: unless-stopped
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_config:
  caddy_data:
  postgres_data:
